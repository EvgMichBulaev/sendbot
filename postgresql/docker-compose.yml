services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: tlg
      POSTGRES_PASSWORD: tlg
      POSTGRES_DB: bot_db
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata

    command: >
      postgres
        -c ssl=off
        -c max_connections=1000
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.7
        -c wal_buffers=16MB
        -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tlg -d bot_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - db-network
    tty: true
    stdin_open: true

volumes:
  pgdata:
    driver: local
    labels:
      environment: pgdata
      owner: team-bot

networks:
  db-network:
    internal: false